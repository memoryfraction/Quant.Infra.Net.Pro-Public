<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="sitebar"><div class="sitebar-in"><a href="/"><span aria-hidden="true">←</span> <span class="sb-zh">返回首页</span><span class="sb-en">Back to Home</span></a>
  <div class="lang-select"><select id="langSelect" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></div></div></div>
<div class="wrap">
  <header>
    <div>
      <p class="brand">Alpha Wealth Lab</p>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
  </header>

  <div class="grid">
    <div>
      <section class="panel">
        <h2 data-i18n="inputsTitle"></h2>
        <p class="hint" data-i18n="inputsHint"></p>
        <div class="fields">
          <div class="full">
            <label for="total" data-i18n="total"></label>
            <input id="total" type="number" min="0" step="1000" value="100000">
            <div class="fieldhint" data-i18n="totalHint"></div>
          </div>
          <div class="full">
            <span class="fakelabel" data-i18n="cfTitle"></span>
            <div class="cf" id="cf" role="radiogroup"></div>
          </div>
          <div><label for="expense" data-i18n="expense"></label><input id="expense" type="number" min="0" step="100" value="2000"></div>
          <div><label for="dca" data-i18n="dca"></label><input id="dca" type="number" min="0" step="100" value="0"></div>
          <div><label for="age" data-i18n="age"></label><input id="age" type="number" min="18" max="100" value="41"></div>
          <div><label for="ageBase" data-i18n="ageBase"></label>
            <select id="ageBase"><option value="110">110</option><option value="115" selected>115</option><option value="120">120</option></select></div>
          <div><label for="pe" data-i18n="pe"></label><input id="pe" type="number" step="0.1" value="26"></div>
          <div><label for="threshold" data-i18n="threshold"></label>
            <select id="threshold"><option value="8">8%</option><option value="10" selected>10%</option></select></div>
        </div>
        <p class="computed" id="sLine"></p>
      </section>

      <section class="panel">
        <h2 data-i18n="sigTitle"></h2>
        <p class="hint" data-i18n="sigHint"></p>
        <div class="fields three">
          <div><label for="spx">SPX</label><input id="spx" type="number" step="0.01" value="7801.77"></div>
          <div><label for="spxMa50">SPX MA50</label><input id="spxMa50" type="number" step="0.01" value="7680.46"></div>
          <div><label for="zeroG" data-i18n="zeroG"></label><input id="zeroG" type="number" step="0.01" value="7707.17"></div>
          <div><label for="qqq">QQQ</label><input id="qqq" type="number" step="0.01" value="757.73"></div>
          <div><label for="qqqHigh" data-i18n="qqqHigh"></label><input id="qqqHigh" type="number" step="0.01" value="759.63"></div>
          <div><label for="rsi">QQQ RSI(14)</label><input id="rsi" type="number" step="0.1" value="68"></div>
          <div><label for="fng">CNN F&amp;G</label><input id="fng" type="number" step="1" value="45"></div>
          <div><label for="aaii" data-i18n="aaii"></label><input id="aaii" type="number" step="0.1" value="46.5"></div>
          <div class="span2"><label for="vix">VIX / VIX3M</label>
            <div class="vixrow"><input id="vix" type="number" step="0.01" value="15.08" aria-label="VIX"><input id="vix3m" type="number" step="0.01" value="17.72" aria-label="VIX3M"></div></div>
          <div><label for="pe500" data-i18n="pe500"></label><input id="pe500" type="number" step="0.1" value="19"></div>
          <div><label for="y10" data-i18n="y10"></label><input id="y10" type="number" step="0.01" value="5.28"></div>
        </div>
      </section>
    </div>

    <div>
      <section class="panel">
        <h2 data-i18n="allocTitle"></h2>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <div class="legend" id="legend"></div>
        <div id="validation"></div>
      </section>

      <section class="panel" id="btPanel">
        <div class="bt-head">
          <div>
            <h2 data-i18n="btTitle"></h2>
            <p class="hint" id="btRange"></p>
          </div>
        </div>
        <div id="btBody"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="tableTitle"></h2>
        <p class="hint" data-i18n="tableHint"></p>
        <div class="tablewrap">
          <table>
            <thead><tr>
              <th data-i18n="colTicker"></th><th data-i18n="colTarget"></th><th data-i18n="colTargetUsd"></th>
              <th data-i18n="colCurrent"></th><th data-i18n="colDev"></th><th data-i18n="colAction"></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="computed" id="rebalLine"></p>
      </section>

      <section class="panel">
        <h2 data-i18n="trigTitle"></h2>
        <p class="hint" data-i18n="trigHint"></p>
        <div class="signals" id="signals"></div>
        <div class="verdict" id="verdict"></div>
      </section>
    </div>
  </div>

  <footer data-i18n="disclaimer"></footer>
</div>

<script src="/js/site-lang.js?v=20261008"></script>
<script src="/calculator/calculator.js?v=20261008"></script>
